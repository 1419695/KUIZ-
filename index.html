<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lost Tower of Syntax: Grammar Adventure</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f39c12;
            --danger: #e74c3c;
            --success: #2ecc71;
            --bg-dark: #2c3e50;
            --text-light: #ecf0f1;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--bg-dark);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding: 10px;
            background: #eee;
            border-radius: 10px;
            font-weight: 600;
        }

        .hearts {
            color: var(--danger);
            font-size: 1.2rem;
        }

        .narrative {
            font-style: italic;
            color: #666;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #222;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-start {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .level-up-flash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(46, 204, 113, 0.3);
            border-radius: 20px;
            pointer-events: none;
            animation: flash 0.5s ease-out;
        }

        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .score-final {
            font-size: 2rem;
            font-weight: 800;
            color: var(--secondary);
            margin: 1rem 0;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="result-icon">🏰</div>
            <h1>The Lost Tower of Syntax</h1>
            <p>Buktikan kekuatan bahasa anda dan takluki 5 tingkat Menara Ilmu untuk mendapatkan <strong>Crystal of Fluency</strong>!</p>
            <button class="btn btn-start" onclick="startGame()">Mula Pengembaraan</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="status-bar">
                <div>Lvl: <span id="lbl-level">1</span></div>
                <div class="hearts" id="lbl-hearts">❤️❤️❤️</div>
                <div>Skor: <span id="lbl-score">0</span></div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div id="narrative" class="narrative"></div>
            <div id="question" class="question-box"></div>

            <div class="options-grid" id="options">
                <!-- Buttons generated by JS -->
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <div id="result-icon" class="result-icon"></div>
            <h2 id="result-title">Keputusan</h2>
            <p id="result-text"></p>
            <div class="score-final">Skor: <span id="final-score">0</span></div>
            <button class="btn btn-start" onclick="resetGame()">Cuba Lagi</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                level: 1,
                title: "The Gate of Pronouns",
                narrative: "Pintu batu raksasa ini meminta anda mengenalpasti subjek yang tepat untuk membukanya.",
                q: "Sarah is my best friend. I met ____ at the library yesterday.",
                options: ["He", "Her", "She", "Him"],
                answer: "Her"
            },
            {
                level: 2,
                title: "The Hallway of Prepositions",
                narrative: "Lantai di hadapan anda akan runtuh mengikut masa. Tentukan preposisi waktu yang betul!",
                q: "The final exam will start ____ 08:00 AM sharp on Monday.",
                options: ["In", "On", "At", "By"],
                answer: "At"
            },
            {
                level: 3,
                title: "The Library of Tenses",
                narrative: "Buku-buku di sini terbang! Pastikan anda menggunakan Present Continuous yang tepat untuk menenangkan mereka.",
                q: "Look! The birds ________ south because the season is changing.",
                options: ["Is flying", "Flies", "Are flying", "Flew"],
                answer: "Are flying"
            },
            {
                level: 4,
                title: "The Spiral Stairs",
                narrative: "Tangga ini berpusing laju. Stabilkan bayangan masa lalu dengan Past Tense yang betul.",
                q: "While I ________ for the bus, it started to rain heavily.",
                options: ["Wait", "Was waiting", "Were waiting", "Waited"],
                answer: "Was waiting"
            },
            {
                level: 5,
                title: "The Zenith of Conjunctions",
                narrative: "Crystal of Fluency berada di hadapan anda! Gunakan logik penyambung ayat untuk menghancurkan perisai terakhir.",
                q: "________ the weather was terrible, the hikers decided to continue their journey.",
                options: ["Because", "Despite", "Although", "However"],
                answer: "Although"
            }
        ];

        let currentLevel = 0;
        let score = 0;
        let hearts = 3;

        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            end: document.getElementById('end-screen')
        };

        function showScreen(screenKey) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenKey].classList.add('active');
        }

        function startGame() {
            currentLevel = 0;
            score = 0;
            hearts = 3;
            updateStatus();
            showQuestion();
            showScreen('game');
        }

        function showQuestion() {
            const qData = questions[currentLevel];
            document.getElementById('lbl-level').innerText = qData.level;
            document.getElementById('narrative').innerText = `Lantai ${qData.level}: ${qData.title} - ${qData.narrative}`;
            document.getElementById('question').innerText = qData.q;
            
            const progress = ((currentLevel) / questions.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const correct = questions[currentLevel].answer;
            const container = document.getElementById('main-container');

            if (selected === correct) {
                score += 10;
                currentLevel++;
                
                const flash = document.createElement('div');
                flash.className = 'level-up-flash';
                container.appendChild(flash);
                setTimeout(() => flash.remove(), 500);

                if (currentLevel >= questions.length) {
                    victory();
                } else {
                    updateStatus();
                    showQuestion();
                }
            } else {
                hearts--;
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);
                updateStatus();
                if (hearts <= 0) {
                    gameOver();
                }
            }
        }

        function updateStatus() {
            document.getElementById('lbl-score').innerText = score;
            let heartStr = '';
            for(let i=0; i<3; i++) {
                heartStr += i < hearts ? '❤️' : '🖤';
            }
            document.getElementById('lbl-hearts').innerText = heartStr;
        }

        function victory() {
            showScreen('end');
            document.getElementById('final-score').innerText = score;
            document.getElementById('result-icon').innerText = '🏆';
            document.getElementById('result-title').innerText = hearts === 3 ? 'Perfect Victory!' : 'The Brave Survivor';
            
            if (hearts === 3) {
                document.getElementById('result-text').innerText = "Luar biasa! Anda menguasai Crystal of Fluency tanpa sebarang kesilapan. Anda adalah Master Bahasa Inggeris!";
            } else {
                document.getElementById('result-text').innerText = "Tahniah! Walaupun sukar, anda berjaya mencapai puncak menara dan menuntut Crystal of Fluency.";
            }
        }

        function gameOver() {
            showScreen('end');
            document.getElementById('final-score').innerText = score;
            document.getElementById('result-icon').innerText = '💀';
            document.getElementById('result-title').innerText = 'Game Over';
            document.getElementById('result-text').innerText = "Kekuatan menara terlalu hebat kali ini. Jangan berputus asa, teruskan belajar dan cuba lagi!";
        }

        function resetGame() {
            showScreen('start');
        }
    </script>
</body>
</html>
